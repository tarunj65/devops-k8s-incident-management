---
- name: Prepare Ubuntu nodes for Kubernetes
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap persistantly in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Configure required Kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes networking parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.nridge-nf-call-ip6tables = 1
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl settings

    - name: Apply networking settings immediately
      ansible.builtin.command: sysctl --system
      changed_when: false

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true
